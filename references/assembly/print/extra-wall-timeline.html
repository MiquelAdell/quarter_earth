<!doctype html>
<!--
  Quarter Earth · The Assembly — wall timeline. Outside the ten-sheet kit.
  A4 LANDSCAPE, seven pages: one per round (1–6) plus one for the replay. Tape side by side on the wall.
  Fallback if the projector fails: the operator reads the report aloud and writes the actual changes here.
  Round years from W1: planning in 2022, 2027, 2032, 2037, 2042, 2047; the game ends in 2052.
  Localisation: every visible string lives in STRINGS below.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quarter Earth · Assembly · Wall timeline</title>
<style>
  @page { size: A4 landscape; margin: 8mm; }
  :root { --ink: #19151d; --muted: #4a434d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; color: var(--ink); background: #fff; font: 11pt/1.3 Arial, Helvetica, sans-serif; }
  .sheet { width: 281mm; height: 193mm; overflow: hidden; display: flex; flex-direction: column; gap: 3mm; break-after: page; }
  .sheet:last-child { break-after: auto; }
  header { display: flex; align-items: baseline; gap: 6mm; border-bottom: 1mm solid var(--ink); padding-bottom: 2mm; }
  .round { font: 700 30pt/1 Arial, sans-serif; }
  .years { font: 700 18pt/1 Arial, sans-serif; }
  .mid { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; }
  .box { border: 0.5mm solid var(--ink); padding: 2.5mm; }
  h2 { margin: 0 0 1.5mm; font-size: 9pt; text-transform: uppercase; letter-spacing: .06em; }
  .w { border-bottom: 0.3mm solid var(--ink); height: 8mm; }
  .tick { display: inline-block; width: 4mm; height: 4mm; border: 0.4mm solid var(--ink); vertical-align: -0.6mm; margin: 0 1mm 0 3mm; }
  table { width: 100%; border-collapse: collapse; }
  td, th { border: 0.3mm solid var(--ink); padding: 1.5mm 2mm; text-align: left; height: 11mm; }
  th { font-size: 8pt; text-transform: uppercase; letter-spacing: .04em; height: auto; }
  .hint { font-size: 8pt; color: var(--muted); }
  @media screen { body { background: #ddd; padding: 10mm; } .sheet { background: #fff; margin: 0 auto 10mm; outline: 1px solid #999; } }
</style>
</head>
<body>
<div id="pages"></div>
<script>
/* ===== STRINGS: replace per language (W3/W7) ===== */
const STRINGS = {
  round: "Round", replay: "Replay",
  replayNote: "Same starting world as round ___ · losing package substituted",
  /* W1: planning years 2022, 2027 … 2047; the game ends in 2052 (model-baseline.md §3). */
  years: ["2022 → 2027", "2027 → 2032", "2032 → 2037", "2037 → 2042", "2042 → 2047", "2047 → 2052", "____ → ____"],
  result: "Result of the vote",
  outcomes: ["Package A", "Package B", "Current policy carried forward"],
  votes: "Votes A / B / current policy",
  runoff: "Runoff held",
  cards: "Cards passed (ID · name · cost)",
  sponsors: "Sponsors",
  forecastCols: ["Prediction (indicator)", "Forecast", "Actual change (unit)", "Held?"],
  forecastHint: "Write the forecast BEFORE the operator advances. Fill the actual change from the report.",
  voice: "First response — someone who voted against",
  cause: "One sentence: what caused the result?"
};
/* ===== renderer ===== */
const S = STRINGS, esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const page = (label, years, note) => `<section class="sheet">
  <header><span class="round">${esc(label)}</span><span class="years">${esc(years)}</span><span class="hint">${esc(note || "")}</span></header>
  <div class="mid">
    <div class="box"><h2>${esc(S.result)}</h2>${S.outcomes.map((o,i) => `<span class="tick" style="${i ? "" : "margin-left:0"}"></span>${esc(o)}`).join(" ")}
      <div style="margin-top:2mm">${esc(S.votes)}: ____ / ____ / ____ <span class="tick"></span>${esc(S.runoff)}</div>
      <h2 style="margin-top:2mm">${esc(S.cards)}</h2><div class="w"></div><div class="w"></div><div class="w"></div></div>
    <div class="box"><h2>${esc(S.sponsors)}</h2><div class="w"></div>
      <h2 style="margin-top:2mm">${esc(S.voice)}</h2><div class="w"></div><div class="w"></div>
      <h2 style="margin-top:2mm">${esc(S.cause)}</h2><div class="w"></div></div></div>
  <div class="box"><table><tr>${S.forecastCols.map(c => `<th>${esc(c)}</th>`).join("")}</tr>
    ${[1,2].map(() => `<tr><td></td><td style="width:32mm">↑ &nbsp; ↓</td><td style="width:60mm"></td><td style="width:28mm">✓ &nbsp; ✗ &nbsp; ?</td></tr>`).join("")}</table>
    <div class="hint" style="margin-top:1mm">${esc(S.forecastHint)}</div></div>
</section>`;
document.getElementById("pages").innerHTML =
  [1,2,3,4,5,6].map(n => page(`${S.round} ${n}`, S.years[n-1])).join("") + page(S.replay, S.years[6], S.replayNote);
</script>
</body>
</html>
